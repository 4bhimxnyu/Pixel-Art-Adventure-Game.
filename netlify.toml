[build]
  command = "npm run build"
  publish = "dist"

# TanStack Router is a client-side SPA: every path must serve index.html so a
# refresh or a direct link doesn't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
